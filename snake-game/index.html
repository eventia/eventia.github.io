<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="브라우저에서 바로 즐기는 스네이크 게임. PC와 모바일 모두 지원합니다.">
  <meta name="author" content="AI튜터 바람">
  <meta name="theme-color" content="#0e1621">
  <title>스네이크 게임</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230e1621'/%3E%3Crect x='3' y='7' width='8' height='3' rx='1' fill='%234ade80'/%3E%3Ccircle cx='12.5' cy='4' r='1.6' fill='%23f87171'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <!-- F7 점수판 -->
    <header class="app-header">
      <h1 class="app-title">스네이크</h1>
      <div class="score-board" aria-live="polite">
        <p class="score-item"><span class="score-label">점수</span> <span id="score" class="score-value">0</span></p>
        <p class="score-item"><span class="score-label">최고</span> <span id="best_score" class="score-value">0</span></p>
      </div>
    </header>

    <!-- F1 게임 보드 · F4 오버레이 -->
    <div id="board_wrap" class="board-wrap">
      <canvas id="board" class="board" role="img" aria-label="스네이크 게임 보드"></canvas>
      <div id="overlay" class="overlay">
        <p id="overlay_title" class="overlay-title">스네이크</p>
        <p id="overlay_text" class="overlay-text">먹이를 먹고 길게 자라세요</p>
        <button id="start_button" class="btn" type="button">시작</button>
        <p class="overlay-hint">
          <span class="hint-pc">방향키·WASD로 이동, Enter·Space로 시작</span>
          <span class="hint-touch">스와이프하거나 아래 버튼으로 이동</span>
        </p>
      </div>
    </div>

    <!-- F6 터치 기기용 십자 버튼 -->
    <div class="dpad" role="group" aria-label="방향 버튼">
      <button class="dpad-btn dpad-up" type="button" data-dir="up" aria-label="위">▲</button>
      <button class="dpad-btn dpad-left" type="button" data-dir="left" aria-label="왼쪽">◀</button>
      <button class="dpad-btn dpad-right" type="button" data-dir="right" aria-label="오른쪽">▶</button>
      <button class="dpad-btn dpad-down" type="button" data-dir="down" aria-label="아래">▼</button>
    </div>
  </main>

  <footer class="app-footer">made by AI튜터 바람</footer>

  <script src="js/game.js"></script>
</body>
</html>
